<style>
.intro{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;margin:34px 0 4px;padding:16px 20px;background:#fbf7ee;border:1px solid var(--rule);border-left:4px solid var(--flame);border-radius:4px}
.intro .ex{font:500 11.5px "DM Mono";letter-spacing:.1em;text-transform:uppercase;color:var(--flame);white-space:nowrap}
.intro p{margin:0;font-size:16.5px;line-height:1.5;color:var(--muted)}.intro p b{color:var(--ink)}
.intro a{font:500 13px "DM Mono";color:var(--flame);text-decoration:none;white-space:nowrap;padding:8px 12px;border:1px solid var(--flame);border-radius:3px}
.intro a:hover,.intro a:focus-visible{background:var(--flame);color:#fff;outline:none}
@media (max-width:760px){.intro{grid-template-columns:1fr;gap:10px}}
.step{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:center;padding:52px 0;border-bottom:1px solid var(--rule)}
.step .n{font:500 64px/1 Fraunces;color:var(--flame);letter-spacing:-2px}
.step h2{margin:8px 0 10px;font-size:30px}
.step p{font-size:17px;line-height:1.6;color:var(--muted);margin:0 0 12px}
.step p b{color:var(--ink)}
.viz{background:#fbf7ee;border:1px solid var(--rule);border-radius:4px;padding:20px 22px}
.viz .cap{font:500 11.5px "DM Mono";letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
/* 1 watch */
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kind{padding:12px 14px;border-radius:3px;background:var(--paper-2)}
.kind .c{font:500 28px/1 "DM Mono";color:var(--ink)}.kind h3{font:600 15px Fraunces;margin:4px 0 4px}
.kind p{font-size:13px;line-height:1.45;color:var(--muted);margin:0}
/* 2 learn */
.strip{display:grid;grid-template-columns:repeat(17,1fr);gap:4px}
.strip i{aspect-ratio:1;border-radius:50%;background:var(--ink);opacity:.85;transition:background .3s,opacity .3s,transform .3s}
.strip i.out{background:transparent;outline:2px solid var(--flame);outline-offset:-2px;opacity:1;transform:scale(1.15)}
.strip-key{display:flex;justify-content:space-between;margin-top:12px;font-size:13.5px;color:var(--muted)}
.strip-key b{color:var(--flame);font-family:"DM Mono";font-weight:500}
/* 3 split */
.split{display:flex;height:46px;border-radius:3px;overflow:hidden;background:var(--paper-2)}
.split i{height:100%;border-right:1px solid #fbf7ee;background:#cdbf9f}
.split i:nth-child(even){background:#bcae8e}.split i.me{background:var(--flame)}
.ruler{position:relative;height:62px;margin-top:6px}
.ruler .tick{position:absolute;top:0;height:10px;border-left:1px solid var(--muted)}
.ruler .slice{position:absolute;top:16px;height:12px;border:1px solid var(--ink);border-top:0}
.ruler .me{position:absolute;top:34px;height:12px;background:var(--flame)}
.ruler span{position:absolute;font:500 12px "DM Mono";white-space:nowrap}
.verdict{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.verdict div{border-top:2px solid var(--ink);padding-top:6px}.verdict b{display:block;font:500 24px "DM Mono";letter-spacing:-.5px}
.verdict span{font-size:12.5px;color:var(--muted)}.verdict .hot b{color:var(--flame)}
.bg{font-size:13px;color:var(--muted);margin:12px 0 0}
.splitwrap{position:relative;padding-top:22px}
.pin{position:absolute;top:0;transform:translateX(-50%);font:600 12px "DM Mono";color:var(--flame);white-space:nowrap}
.pin::after{content:"";position:absolute;left:50%;top:15px;width:1px;height:7px;background:var(--flame)}
.cmp{display:grid;gap:8px;margin:18px 0 14px}
.cmp .row{display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:12px;font-size:14px}
.cmp .row i{display:block;height:22px;background:#bcae8e;border-radius:2px;position:relative}
.cmp .row.me i{background:var(--flame)}
.cmp .row b{grid-column:2;font:500 13px "DM Mono";margin-top:-28px;justify-self:end;display:none}
.cmp .row{grid-template-columns:110px minmax(0,1fr) 54px}.cmp .row b{display:block;grid-column:3;margin:0;justify-self:end}
.cmp .row.me b{color:var(--flame)}
/* 4 explain */
.wf{display:grid;grid-template-columns:minmax(0,1fr) 170px 52px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule);font-size:14px}
.wf .trk{position:relative;height:14px}.wf .seg{position:absolute;top:2px;height:10px;background:var(--flame)}
.wf.neg .seg{background:var(--sea)}.wf.base .seg{background:#b3a78f}.wf.base{color:var(--muted)}
.wf .tick{position:absolute;top:-2px;width:3px;height:18px;margin-left:-1px;background:var(--ink)}
.wf.end .tick{background:var(--flame);width:5px}
.wf .v{font:500 13px "DM Mono";text-align:right}.wf.start,.wf.end{font-weight:700}.wf.end .v{color:var(--flame)}
.wf.end{border-bottom:2px solid var(--ink)}.wfall{border-top:2px solid var(--ink)}
/* right? */
.right{padding:56px 0 40px;border-bottom:1px solid var(--rule)}
.right .head{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:end}
.dumb{margin-top:28px;background:#fbf7ee;border:1px solid var(--rule);border-radius:4px;padding:16px 22px 6px}
.drow{display:grid;grid-template-columns:170px minmax(0,1fr) 150px;gap:20px;align-items:center;height:64px;border-top:1px solid var(--rule)}
.drow .lab{font-size:15px}.drow .lab small{display:block;font:500 11.5px "DM Mono";color:var(--muted);margin-top:2px}
.drow .trk{position:relative;height:100%}
.drow .trk i{position:absolute}
.drow .trk .g{top:0;bottom:0;width:0;border-left:1px dashed #ddd3c0}.trk .g.even{border-left:1.5px solid #1d1a16;opacity:.55}
.drow .trk .range{top:50%;height:12px;margin-top:-6px;background:rgba(194,65,12,.16);border-radius:6px}
.drow .trk .link{top:50%;height:2px;margin-top:-1px;background:#1d1a16}
.drow .trk .said,.trk .got{top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%}
.drow .trk .said{background:#fbf7ee;border:2px solid #1d1a16}
.drow .trk .got{background:var(--flame);box-shadow:0 0 0 2px #fbf7ee}
.drow.small .got{opacity:.45}.drow.small .range{background:rgba(194,65,12,.08)}
.drow .out{font:500 14px "DM Mono";text-align:right;white-space:nowrap}
.drow .out .s{color:var(--muted)}.drow .out b{font-weight:500;color:var(--flame);font-size:17px}
.drow .out em{font-style:normal;color:var(--muted);margin-left:6px}
.axis{display:grid;grid-template-columns:170px minmax(0,1fr) 150px;gap:20px;margin-bottom:6px}
.axis .ticks{position:relative;height:20px}.axis .ticks span{position:absolute;transform:translateX(-50%);font:500 12px "DM Mono";color:#6b6457;white-space:nowrap}
.axis .ohead{font:500 11px "DM Mono";text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right}
.key{display:flex;gap:20px;font-size:13.5px;color:var(--muted);margin-top:14px}
.key i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}
/* blind */
.blind{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.blind div{background:var(--paper-2);border-radius:3px;padding:16px;border-top:3px solid var(--flame)}
.blind b{display:block;font:600 17px Fraunces;margin-bottom:6px}.blind span{font-size:14px;line-height:1.5;color:var(--muted)}
details.nerd{margin:44px 0 0;border:1px solid var(--rule);border-radius:4px;background:#fbf7ee}
details.nerd summary{cursor:pointer;padding:16px 20px;font:600 18px Fraunces;list-style:none}
details.nerd summary::after{content:"＋";float:right;color:var(--flame)}details.nerd[open] summary::after{content:"－"}
details.nerd summary:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
details.nerd .body{padding:0 20px 18px;columns:2;column-gap:36px;font-size:14.5px;line-height:1.6;color:var(--muted)}
details.nerd p{margin:0 0 12px;break-inside:avoid}details.nerd b{color:var(--ink)}
@media (max-width:900px){.step,.right .head{grid-template-columns:1fr;gap:20px}.blind{grid-template-columns:1fr 1fr}details.nerd .body{columns:1}.drow,.axis{grid-template-columns:96px minmax(0,1fr) 96px;gap:10px}.drow{height:58px}}
</style>
</head><body>
<section class="band" id="hero"></section>
<main id="main"><p class="small">loading…</p></main>
<footer class="site-foot"><p><b>snuffml</b> · predicting Survivor winners from nothing but the edit.
  Every probability is out of sample: the model never saw the season it's predicting.
  <a href="method.html">How it works</a> · <a href="https://github.com/amonsalve1/snuff_ml">code and data on GitHub</a></p></footer>
<script type="module">
import { loadIndex, loadTrack, loadSeason, ranked, heat, slug } from "./js/common.js?v=32";
import { band, nav } from "./js/band.js?v=32";
import { GROUPS } from "./js/panel.js?v=32";

const hero = document.getElementById("hero");
hero.innerHTML = nav("Method") + `<div class="copy"><div class="kicker">Method</div>
  <h1>How a number gets made</h1><p class="deck">Follow one real one through the whole thing, then see how far to trust it.</p></div>`;
band(hero, 0.05);

const [index, track, s] = await Promise.all([loadIndex(), loadTrack(), loadSeason(41)]);
const EP = 6, me = s.players.find((p) => p.name === "Erika");
const al = ranked(s, EP), N = al.length, p = me.probs[EP], even = 1 / N, h = p * N;
const finished = index.seasons.filter((x) => !x.live);
const pc = (v) => `${(v * 100).toFixed(1)}%`;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// 1. what it reads, by kind
const KIND_TEXT = {
  airtime: "How often they get a confessional, and how much of each episode is theirs.",
  "edit tone": "Whether the edit is complex or one note, visible or hidden, steady or flip-flopping.",
  game: "What actually happened to them: votes received, immunity, advantages.",
  "early flag": "Whether they were the early front-runner, a known curse in the new era.",
};
const kinds = Object.entries(GROUPS).filter(([g]) => g !== "baseline").map(([g, keys]) =>
  `<div class="kind"><div class="c">${keys.filter((k) => index.labels[k]).length}</div><h3>${g[0].toUpperCase() + g.slice(1)}</h3><p>${KIND_TEXT[g]}</p></div>`).join("");
const nMeasures = Object.values(GROUPS).flat().filter((k) => index.labels[k]).length;
const nBase = GROUPS.baseline.filter((k) => index.labels[k]).length;

// 3. the 100% split
const order = al.slice().sort((a, b) => b.probs[EP] - a.probs[EP]);
const split = order.map((q) => `<i class="${q === me ? "me" : ""}" style="width:${q.probs[EP] * 100}%" title="${q.name} ${pc(q.probs[EP])}"></i>`).join("");
let left = 0; for (const q of order) { if (q === me) break; left += q.probs[EP]; }

// 4. her factors, multiplying out
const rows = me.why[EP].slice(0, 5), rest = me.why_rest[EP] + me.why[EP].slice(5).reduce((a, [, v]) => a + v, 0), total = me.why_total[EP];
const typical = p / Math.exp(total);
const steps = [...rows.map(([k, v]) => ({ k, v, label: (index.labels[k] || [k, k])[v > 0 ? 0 : 1].replace(/\bthem\b/, "Erika") })), { k: "_rest", v: rest, label: "everything else" }];
let cum = 0; const pts = [0];
for (const st of steps) { st.a = cum; cum += st.v; st.b = cum; pts.push(cum); }
const lo = Math.min(...pts), hi = Math.max(...pts), pad = (hi - lo) * 0.08 || 0.5;
const X = (v) => ((v - (lo - pad)) / (hi - lo + 2 * pad)) * 100;
const mult = (v) => `×${Math.exp(v).toFixed(2)}`;
const wf = `<div class="wfall">
  <div class="wf start"><span>a typical player still in</span><span class="trk"><i class="tick" style="left:${X(0)}%"></i></span><span class="v">${pc(typical)}</span></div>
  ${steps.map((st) => `<div class="wf ${st.v >= 0 ? "pos" : "neg"} ${GROUPS.baseline.includes(st.k) ? "base" : ""}"><span>${st.label}</span>
    <span class="trk"><i class="seg" style="left:${X(Math.min(st.a, st.b))}%;width:${Math.max(0.8, Math.abs(X(st.b) - X(st.a)))}%"></i></span><span class="v">${mult(st.v)}</span></div>`).join("")}
  <div class="wf end"><span>Erika</span><span class="trk"><i class="tick" style="left:${X(total)}%"></i></span><span class="v">${pc(p)}</span></div></div>`;

// was it right: pool every season by rating band
const B = ["under 0.5×", "0.5 – 0.8×", "0.8 – 1.25×", "1.25 – 2×", "2 – 3×", "over 3×"];
const agg = B.map(() => ({ won: 0, of: 0, inv: 0, heat: 0 }));
for (const cells of Object.values(track.seasons)) for (const [, hb, won, of, inv, ht] of cells) { const a = agg[hb]; a.won += won; a.of += of; a.inv += inv; a.heat += ht; }
const bands = agg.map((a, k) => {
  const r = a.won / a.of, e = a.inv / a.of, z = 1.96, c = (r + z * z / (2 * a.of)) / (1 + z * z / a.of);
  const w = (z * Math.sqrt(r * (1 - r) / a.of + z * z / (4 * a.of * a.of))) / (1 + z * z / a.of);
  return { band: B[k], n: a.of, won: a.won, said: a.heat / a.of, got: r / e, lo: Math.max(0.13, (c - w) / e), hi: Math.min(5, (c + w) / e) };
});
const LX = (v) => ((Math.log2(Math.max(0.125, Math.min(5, v))) + 3) / (Math.log2(5) + 3)) * 100;
// labels as html: text inside a stretched svg gets squashed
const axis = `<div class="axis"><span></span><div class="ticks">${[0.25, 0.5, 1, 2, 4].map((g) =>
  `<span style="left:${LX(g)}%">${g === 1 ? "even" : g + "×"}</span>`).join("")}</div><span class="ohead">said → happened</span></div>`;
const grid = [0.25, 0.5, 1, 2, 4].map((g) => `<i class="g${g === 1 ? " even" : ""}" style="left:${LX(g)}%"></i>`).join("");
const dumb = bands.map((b) => {
  const small = b.n < 100, a = Math.min(LX(b.said), LX(b.got)), z = Math.max(LX(b.said), LX(b.got));
  return `<div class="drow${small ? " small" : ""}"><span class="lab">rated ${b.band}<small>${b.n.toLocaleString()} cases · ${b.won} won</small></span>
    <div class="trk" role="img" aria-label="rated ${b.band}: the model said ${b.said.toFixed(2)} times an even split, they actually won at ${b.got.toFixed(2)} times">
      ${grid}
      <i class="range" style="left:${LX(b.lo)}%;width:${LX(b.hi) - LX(b.lo)}%"></i>
      <i class="link" style="left:${a}%;width:${z - a}%"></i>
      <i class="said" style="left:${LX(b.said)}%"></i>
      <i class="got" style="left:${LX(b.got)}%"></i>
    </div>
    <span class="out"><span class="s">${b.said.toFixed(1)}×</span> → <b>${b.got.toFixed(1)}×</b>${small ? '<em title="too few cases to say">?</em>' : ""}</span></div>`;
}).join("");

document.getElementById("main").innerHTML = `
<div class="intro"><div class="ex">Worked example</div>
  <p>The four steps below follow <b>one real number</b> from start to finish: Erika's <b>${pc(p)}</b> chance of winning after episode 7 of Survivor 41. She went on to win.</p>
  <a href="index.html#s41/ep7/erika">see it in the season →</a></div>

<section class="step"><div><div class="n">1</div><h2>It watches the edit.</h2>
  <p>Every episode, for every player still in, it logs <b>${nMeasures} measures</b> of how they were shown. Confessional counts come from the survivoR dataset; tone and visibility from fans who grade every player's edit every week, a practice called edgic.</p>
  <p>It never sees the vote before it airs, the jury, or anything the editors left out.</p></div>
  <div class="viz"><div class="cap">What it reads, by kind</div><div class="kinds">${kinds}</div>
    <p class="bg">+ ${nBase} background measures: gender, and whether edgic and timing data exist for that season.</p></div></section>

<section class="step"><div><div class="n">2</div><h2>It learns from every other season.</h2>
  <p>To judge Survivor 41, the model is trained on the other <b>${finished.length - 1}</b> finished seasons, learning which kinds of edits winners get. Then it's tested on 41, which it has never seen.</p>
  <p>That's repeated once per season, so <b>every number on this site</b> comes from a model that was in the dark about that season.</p></div>
  <div class="viz"><div class="cap">One model per season, each blind to its own</div><div class="strip" id="strip">${finished.map((x) => `<i data-s="${x.season}" title="S${x.season}"></i>`).join("")}</div>
  <div class="strip-key"><span>● trained on</span><span>held out: <b id="held">S41</b></span></div></div></section>

<section class="step"><div><div class="n">3</div><h2>It splits 100% between whoever is left.</h2>
  <p>After episode 7 there are <b>${N} players</b> still in. Their chances always add to 100%, so a perfectly even split would give each one <b>${pc(even)}</b>.</p>
  <p>Erika gets <b>${pc(p)}</b>: a slice about <b>${h.toFixed(1)}×</b> the size of an even one. That "×" is how the whole site compares players: above 1× the edit favors them, below it doesn't.</p></div>
  <div class="viz"><div class="cap">Episode 7: the ${N} still in, as one 100% bar</div>
    <div class="splitwrap"><span class="pin" style="left:${(left + p / 2) * 100}%">Erika</span><div class="split">${split}</div></div>
    <div class="cmp">
      <div class="row"><span>an even slice</span><i style="width:${(even / Math.max(even, p) / 1.12) * 100}%"></i><b>${pc(even)}</b></div>
      <div class="row me"><span>Erika's slice</span><i style="width:${(p / Math.max(even, p) / 1.12) * 100}%"></i><b>${pc(p)}</b></div>
    </div>
    <div class="verdict"><div><b>${pc(even)}</b><span>an even split, 1 in ${N}</span></div><div class="hot"><b>${pc(p)}</b><span>Erika's slice</span></div><div><b>${h.toFixed(1)}×</b><span>her odds against an even split</span></div></div></div></section>

<section class="step"><div><div class="n">4</div><h2>It shows its working.</h2>
  <p>Start from a typical player's odds, then multiply by each thing about Erika's edit that differed from everyone else's. The column lands exactly on her ${pc(p)}.</p>
  <p>Why does a typical player start at <b>${pc(typical)}</b> when an even split is ${pc(even)}? A few favorites hold big slices, so the middle of the pack sits below an even share.</p>
  <p>Anything the whole cast shares cancels out, so every row is about her. The grey row is a background prior the model carries for gender: it's shown, but it says nothing about this episode.</p></div>
  <div class="viz"><div class="cap">Why ${pc(p)}, factor by factor</div>${wf}</div></section>

<section class="right"><div class="head"><div><div class="num">So, was it right?</div>
  <h2>When it rated players <em>twice an even split</em>, how often did they actually win?</h2></div>
  <p class="lede" style="margin:0">Every rating it ever gave, grouped, against what really happened. Around even, it's right on. Further out, reality is <b>more extreme</b> than it predicted: favorites won more than it said and long shots won less. It's cautious, not reckless.</p></div>
  <div class="dumb">${axis}${dumb}</div>
  <div class="key"><span><i style="background:#fbf7ee;border:1px solid #1d1a16"></i>what it said</span><span><i style="background:#c2410c"></i>what happened</span><span><i style="background:rgba(194,65,12,.2);border-radius:2px"></i>likely range</span><span>? too few cases to say</span></div>
</section>

<section class="f" style="border:0"><div class="num">What it can't see</div>
  <h2>A model of the edit is only as good as the edit.</h2>
  <div class="blind">
    <div><b>Returns from the Edge</b><span>Off camera for weeks, then back to win. Chris in S38 was invisible by design.</span></div>
    <div><b>One-of-a-kind winners</b><span>Erika won with the lowest share of confessionals of any winner. A model of the edit will be late on that.</span></div>
    <div><b>Off camera</b><span>Jury relationships, conversations that never aired, the vote itself.</span></div>
    <div><b>The airing season</b><span>The newest episodes can be hand entered from fan tallies until official data lands. The season page says so.</span></div>
  </div>
  <details class="nerd"><summary>For the stats-minded</summary><div class="body">
    <p><b>Model.</b> A regularized logistic regression on per-player, per-episode features, with Platt calibration. Each episode's probabilities are renormalized so the players still in sum to one.</p>
    <p><b>Eras.</b> The new era (S41 on) uses the geometric mean of a pooled model and a new-era-only model; older seasons use the pooled model.</p>
    <p><b>Validation.</b> Leave one season out across all ${finished.length} finished seasons; every published probability is out of sample. S38 and S41 are excluded from fitting as outliers but still predicted and scored.</p>
    <p><b>Explanations.</b> Each factor is its logit contribution scaled by the calibrator's slope, minus the mean contribution across the players still in. They sum to log(p ÷ geometric-mean p) within a median of 0.022 log units; the remainder is shown as "everything else".</p>
    <p><b>Calibration bands.</b> Odds against an even split, binned; "actual" is the win rate divided by the average even split in that bin, with Wilson 95% intervals.</p>
    <p><b>Data.</b> <a href="https://github.com/doehm/survivoR">survivoR</a> for confessionals, votes and results; community edgic ratings for tone and visibility. Code and the full study: <a href="https://github.com/amonsalve1/snuff_ml">github.com/amonsalve1/snuff_ml</a>.</p>
  </div></details>
</section>`;

// step 2: walk the held-out season across the strip, then rest on 41
const dots = [...document.querySelectorAll("#strip i")], held = document.getElementById("held");
const hold = (sn) => { for (const d of dots) d.classList.toggle("out", +d.dataset.s === sn); held.textContent = `S${sn}`; };
hold(41);
if (!reduce) {
  let k = 0, timer = null;
  const io = new IntersectionObserver(([e]) => {
    if (e.isIntersecting && !timer) timer = setInterval(() => { k = (k + 1) % dots.length; hold(+dots[k].dataset.s); }, 420);
    else if (!e.isIntersecting && timer) { clearInterval(timer); timer = null; hold(41); }
  }, { threshold: 0.6 });
  io.observe(document.getElementById("strip"));
}
</script></body></html>
